name: FloodGuard AI — CI Test & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: Backend API & ML Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio scikit-learn joblib httpx aiosqlite asyncpg "bcrypt<=4.0.1" structlog

      - name: Retrain ML models in runner environment
        run: |
          PYTHONPATH=. python -m ml.training.train_all

      - name: Run unit test suite
        run: |
          PYTHONPATH=. python -m pytest tests/unit -v --tb=short 2>&1 | tee test_run.log
          TEST_EXIT=${PIPESTATUS[0]}
          echo "## Backend API & ML Tests Output (Exit Code: $TEST_EXIT)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 test_run.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $TEST_EXIT

  frontend-build:
    name: Next.js Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
