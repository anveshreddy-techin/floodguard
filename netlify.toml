[build]
  # Base directory — Netlify runs ALL commands from here
  base = "apps/web"
  # Build command — runs inside apps/web
  command = "npm install && npm run build"
  # Static export output, relative to base
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Serve index.html for all unmatched routes (SPA fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
