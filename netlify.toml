[build]
  # Build command — runs from the repo root, targets the web app
  command = "cd apps/web && npm install && npm run build"
  # Static export output directory
  publish = "apps/web/out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# SPA-style fallback: any path not found as a file → serves the 404 page
[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404
