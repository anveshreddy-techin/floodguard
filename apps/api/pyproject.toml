[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floodguard-api"
version = "0.1.0"
description = "FloodGuard AI — Backend API (SIH26192)"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    
    # Validation / serialization
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    
    # Database
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.15.1",
    
    # HTTP client
    "httpx>=0.27.0",
    
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    
    # Scheduling
    "apscheduler>=3.10.4",
    
    # ML
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scikit-learn>=1.4.2",
    "xgboost>=2.0.3",
    "joblib>=1.4.0",
    "shap>=0.45.0",
    
    # GIS
    "geopandas>=0.14.3",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "rasterio>=1.3.9",
    
    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "anyio>=4.3.0",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=24.4.0",
    "ruff>=0.4.1",
    "mypy>=1.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
